name: n8n

services:
  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${DB_DATABASE_NAME:-n8n}
      DB_POSTGRESDB_USER: ${DB_USERNAME:-n8n}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "5678:5678"
    # n8n runs as uid 1000 (the "node" user). If this directory doesn't exist yet,
    # Docker creates it owned by root and n8n fails with EACCES on startup. Fix:
    #   mkdir -p ${N8N_DATA_LOCATION:-./data} && sudo chown -R 1000:1000 ${N8N_DATA_LOCATION:-./data}
    volumes:
      - ${N8N_DATA_LOCATION:-./data}:/home/node/.n8n
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: n8n_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-n8n}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE_NAME:-n8n}
    volumes:
      - ${DB_DATA_LOCATION:-./postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10
